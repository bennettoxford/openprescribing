name: Check measure review dates

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - check_measures_action
    paths:
      - "openprescribing/measures/definitions/**/*.json"
      - "scripts/check_measures.py"
      - ".github/workflows/check_measures.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: measure-reviews
  cancel-in-progress: false

jobs:
  check-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check overdue reviews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: "true"
        run: python scripts/check_measures.py

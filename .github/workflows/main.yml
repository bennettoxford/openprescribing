name: "OpenPrescribing CI"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install just
        uses: ./.github/actions/install-just
      - name: Retrieve Google Cloud credentials
        run: ./.github/scripts/decrypt_secret.sh
        env:
          GOOGLE_CLOUD_GITHUB_ACTIONS_PASSPHRASE: ${{ secrets.GOOGLE_CLOUD_GITHUB_ACTIONS_PASSPHRASE }}
      - name: Unit tests
        run: just test-docker-nonfunctional && docker compose run test-production
        env:
          TEST_SUITE:
            nonfunctional
            # We set these because the test service depends on the
            # browserstacklocal-test service for its network, and the latter won't start
            # without them.
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      - name: Notify slack failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel: tech-noise
          status: "FAILURE (unit_test)"
          color: danger

  functional_tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: ["Edge:latest:Windows:10", "Firefox:latest:OS X:Catalina"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Retrieve Google Cloud credentials
        run: ./.github/scripts/decrypt_secret.sh
        env:
          GOOGLE_CLOUD_GITHUB_ACTIONS_PASSPHRASE: ${{ secrets.GOOGLE_CLOUD_GITHUB_ACTIONS_PASSPHRASE }}
      - name: Functional tests
        run: docker compose run test
        env:
          TEST_SUITE: functional
          BROWSER: ${{ matrix.browser }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_LOCAL_IDENTIFIER: ${{ github.run_id }}-${{ strategy.job-index }}
      - name: Notify slack failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BROWSER: ${{ matrix.browser }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel: tech-noise
          status: "FAILURE (functional test $BROWSER)"
          color: danger

  linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "Linting"
        run: |
          pip install -r requirements.dev.txt
          scripts/lint.sh
      - name: Notify slack failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel: tech-noise
          status: "FAILURE (linting)"
          color: danger

  notify_slack:
    runs-on: ubuntu-latest
    needs: [unit_test, functional_tests, linting]

    steps:
      - name: Notify slack success
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel: tech-noise
          status: SUCCESS
          color: good

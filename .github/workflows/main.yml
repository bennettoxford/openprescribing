name: "OpenPrescribing CI"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install just
        uses: ./.github/actions/install-just
      - name: Retrieve Google Cloud credentials
        run: ./.github/scripts/decrypt_secret.sh
        env:
          GOOGLE_CLOUD_GITHUB_ACTIONS_PASSPHRASE: ${{ secrets.GOOGLE_CLOUD_GITHUB_ACTIONS_PASSPHRASE }}
      - name: Unit tests
        run: just test-docker-nonfunctional
        env:
          # We set this because the test service depends on the browserstacklocal-test
          # service for its network, and the latter won't start without it.
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          # We set this for a similar reason. Without a local identifier, starting the
          # browserstacklocal-test service would terminate existing connections to
          # BrowserStack.
          BROWSERSTACK_LOCAL_IDENTIFIER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Notify slack failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel: tech-noise
          status: "FAILURE (unit_test)"
          color: danger

  functional_tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: ["Edge:latest:Windows:10", "Firefox:latest:OS X:Catalina"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install just
        uses: ./.github/actions/install-just
      - name: Retrieve Google Cloud credentials
        run: ./.github/scripts/decrypt_secret.sh
        env:
          GOOGLE_CLOUD_GITHUB_ACTIONS_PASSPHRASE: ${{ secrets.GOOGLE_CLOUD_GITHUB_ACTIONS_PASSPHRASE }}
      - name: Functional tests
        run: just test-docker-browserstack-functional
        env:
          BROWSER: ${{ matrix.browser }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_LOCAL_IDENTIFIER: ${{ github.run_id }}-${{ strategy.job-index }}
      - name: Notify slack failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BROWSER: ${{ matrix.browser }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel: tech-noise
          status: "FAILURE (functional test $BROWSER)"
          color: danger

  system_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run system checks
        run: docker compose run test-production
      - name: Notify slack failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel: tech-noise
          status: "FAILURE (system_checks)"
          color: danger

  linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "Linting"
        run: |
          pip install -r requirements.dev.txt
          scripts/lint.sh
      - name: Notify slack failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel: tech-noise
          status: "FAILURE (linting)"
          color: danger

  notify_slack:
    runs-on: ubuntu-latest
    needs: [unit_test, functional_tests, system_checks, linting]

    steps:
      - name: Notify slack success
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel: tech-noise
          status: SUCCESS
          color: good
